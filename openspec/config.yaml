schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: dbarros.dev, trilingual (pt/en/es) personal blog. Astro + AstroPaper,
  Vlad theme (dark-only), Cloudflare Pages, local Ollama translation.
  Read AGENTS.md first. Sources of truth, by precedence: openspec/specs/,
  docs/design/vlad/ (visual tokens and screens), docs/SPEC.md (original MVP spec).
  Constraints: zero cost; deploy is git push to main; the build never calls an
  LLM or network service; prefer the option with less state.
  One change per MVP implementation slice (see AGENTS.md); each change must end
  with a green build and a verifiable acceptance criterion.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
